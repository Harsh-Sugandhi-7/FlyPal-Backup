<script src="bootstrap/jquery-1.8.3.min.js"></script>
<script language="javascript">

    $(document).ready(function () {

        //alert('document ready function');

        var CorporateID = '<%= HttpContext.Current.Session("CorporateID") %>';
        var UserID = '<%= HttpContext.Current.Session("UserId") %>';
        var UserName = '<%= HttpContext.Current.Session("UserNameForConcurrentLogin") %>';
        var LoginSessionID = '<%= HttpContext.Current.Session("LoginSession") %>';
        var IsAllowConcurrentLogin = '<%= HttpContext.Current.Session("IsAllowConcurrentLogin") %>';

        if (IsAllowConcurrentLogin == 'False' && UserName != 'BTPLADMIN') {

            var str = 'https://www.bytzsoft.net/CRSServices/CRSAPPService.asmx/VerifyUserLoginSessionJSON?ProductID=3&CorporateID=' + CorporateID + '&UserID=' + UserID + '&LoginSessionID=' + LoginSessionID;

            let xhr = new XMLHttpRequest();
            xhr.open("GET", str, true);

            xhr.onreadystatechange = function () {

                if (this.readyState == 4 && this.status == 200) {

                    //alert(this.responseText);

                    if (this.responseText == 'False') {
                        window.location = "logout.aspx";
                    }
                }
            };

            xhr.send();
        }
    });

    window.setInterval(function () {
        myFunction1();
    }, 20000);

    function myFunction1() {

        //alert('ABC from LocalFucntion.htm');

        var CorporateID = '<%= HttpContext.Current.Session("CorporateID") %>';
        var UserID = '<%= HttpContext.Current.Session("UserId") %>';
        var UserName = '<%= HttpContext.Current.Session("UserNameForConcurrentLogin") %>';
        var LoginSessionID = '<%= HttpContext.Current.Session("LoginSession") %>';
        var AllowActiveUsers = '<%= HttpContext.Current.Session("AllowActiveUsers") %>';

        if (AllowActiveUsers > 0 && UserName != 'BTPLADMIN') {

            //var str = 'https://jsonplaceholder.typicode.com/todos/1';

            var str = 'https://www.bytzsoft.net/CRSServices/CRSAPPService.asmx/UpdateUserLoginSessionTimeStampJSON?ProductID=3&CorporateID=' + CorporateID + '&UserID=' + UserID + '&LoginSessionID=' + LoginSessionID;

            let xhr = new XMLHttpRequest();
            xhr.open("GET", str, true);

            xhr.onreadystatechange = function () {

                if (this.readyState == 4 && this.status == 200) {

                    //alert(this.responseText);

                    if (this.responseText == 'False') {
                        window.location = "logout.aspx";
                    }
                }
            };

            xhr.send();
        }
    }
</script>

<!-- 🔄 KeepAlive Script -->
<!-- 🔄 Hidden KeepAlive Log for Debugging -->

<script>
    function keepSessionAlive() {
        fetch('/KeepAlive.ashx', {
            method: 'GET',
            cache: 'no-cache'
        }).then(response => {
            if (response.ok) {
                console.log("KeepAlive sent at " + new Date().toLocaleTimeString());
                // If you want to show it in your div:
                // document.getElementById("keepAliveLog").textContent =
                //    "KeepAlive sent at " + new Date().toLocaleTimeString();
            }
        }).catch(error => {
            console.error('KeepAlive error:', error);
        });
    }

    // Call every 5 minutes
    setInterval(keepSessionAlive, 2 * 60 * 1000);
</script>
